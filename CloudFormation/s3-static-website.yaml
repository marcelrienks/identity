AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudFormation template to provision an S3 bucket for static website hosting with CloudFront CDN and SSL/TLS support.
  Includes ACM certificate with automatic DNS validation and Route 53 DNS configuration for a subdomain with HTTPS enabled.

Parameters:
  IndexDocument:
    Type: String
    Default: index.html
    Description: The index document for the website
  ErrorDocument:
    Type: String
    Default: error.html
    Description: The error document for the website
  HostedZoneName:
    Type: String
    Description: The Route 53 hosted zone domain name WITH trailing dot (e.g., example.com.)
  DomainName:
    Type: String
    Description: The domain name WITHOUT trailing dot (e.g., example.com)
  Subdomain:
    Type: String
    Description: The subdomain to provision (e.g., www)
  CertificateArn:
    Type: String
    Default: ''
    Description: Existing ACM certificate ARN. Leave empty to auto-provision a new certificate
  S3BucketName:
    Type: String
    Default: ''
    Description: Existing S3 bucket name. Leave empty to auto-create a new bucket
  CloudFrontDistributionId:
    Type: String
    Default: ''
    Description: Existing CloudFront distribution ID. Leave empty to auto-create a new distribution
  UseExistingOriginAccessControl:
    Type: String
    Default: ''
    AllowedValues: ['', 'yes', 'no']
    Description: Existing Origin Access Control ID. Leave empty to auto-create. Only used with existing CloudFront.

Conditions:
  ShouldCreateCertificate: !Equals [!Ref CertificateArn, '']
  ShouldCreateS3Bucket: !Equals [!Ref S3BucketName, '']
  ShouldCreateCloudFront: !Equals [!Ref CloudFrontDistributionId, '']

Resources:
  # ACM Certificate for CloudFront (must be in us-east-1)
  SSLCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: ShouldCreateCertificate
    Properties:
      DomainName: !Sub "${Subdomain}.${DomainName}"
      ValidationMethod: DNS

  StaticSiteBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateS3Bucket
    Properties:
      BucketName: !Sub "${Subdomain}-${DomainName}-static"
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldCreateS3Bucket
    Properties:
      Bucket: !Ref StaticSiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${StaticSiteBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !If
                  - ShouldCreateCloudFront
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}"

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: ShouldCreateCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${Subdomain}.${DomainName}-OAC"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: ShouldCreateCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: !Ref IndexDocument
        Aliases:
          - !Sub "${Subdomain}.${DomainName}"
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt StaticSiteBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        ViewerCertificate:
          AcmCertificateArn: !If
            - ShouldCreateCertificate
            - !Ref SSLCertificate
            - !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021-06-16
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: !Sub "/${ErrorDocument}"
          - ErrorCode: 403
            ResponseCode: 403
            ResponsePagePath: !Sub "/${ErrorDocument}"
        HttpVersion: http2and3

  WebsiteDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Ref HostedZoneName
      Name: !Sub "${Subdomain}.${HostedZoneName}"
      Type: A
      AliasTarget:
        DNSName: !If [ShouldCreateCloudFront, !GetAtt CloudFrontDistribution.DomainName, !Sub "d${CloudFrontDistributionId}.cloudfront.net"]
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (constant)

Outputs:
  WebsiteURL:
    Description: CloudFront distribution URL
    Value: !Sub "https://${Subdomain}.${DomainName}"
  CloudFrontDomainName:
    Description: CloudFront distribution domain name
    Value: !If [ShouldCreateCloudFront, !GetAtt CloudFrontDistribution.DomainName, !Sub "d${CloudFrontDistributionId}.cloudfront.net"]
  BucketName:
    Description: Name of the S3 bucket
    Value: !If [ShouldCreateS3Bucket, !Ref StaticSiteBucket, !Ref S3BucketName]
  DistributionId:
    Description: CloudFront distribution ID
    Value: !If [ShouldCreateCloudFront, !Ref CloudFrontDistribution, !Ref CloudFrontDistributionId]
