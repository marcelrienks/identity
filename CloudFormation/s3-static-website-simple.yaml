AWSTemplateFormatVersion: '2010-09-09'
Description: Simplified CloudFormation template for static website hosting.

Parameters:
  IndexDocument:
    Type: String
    Default: index.html
  ErrorDocument:
    Type: String
    Default: error.html
  HostedZoneName:
    Type: String
  DomainName:
    Type: String
  Subdomain:
    Type: String
  CertificateArn:
    Type: String
    Default: ''
  S3BucketName:
    Type: String
    Default: ''
  CloudFrontDistributionId:
    Type: String
    Default: ''
  UseExistingOriginAccessControl:
    Type: String
    Default: ''

Conditions:
  ShouldCreateBucket: !Equals [!Ref S3BucketName, '']
  ShouldCreateCF: !Equals [!Ref CloudFrontDistributionId, '']

Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateBucket
    Properties:
      BucketName: !Sub "website-${Subdomain}-${DomainName}-bucket"
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: ShouldCreateCF
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${Subdomain}.${DomainName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: ShouldCreateCF
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: !Ref IndexDocument
        Aliases:
          - !Sub "${Subdomain}.${DomainName}"
        Origins:
          - Id: S3Origin
            DomainName: !If [ShouldCreateBucket, !GetAtt S3Bucket.RegionalDomainName, !Sub "${S3BucketName}.s3.amazonaws.com"]
            S3OriginConfig: {}
            OriginAccessControlId: !Ref OAC
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021-06-16

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldCreateBucket
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${S3Bucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Ref HostedZoneName
      Name: !Sub "${Subdomain}.${HostedZoneName}"
      Type: A
      AliasTarget:
        DNSName: !If [ShouldCreateCF, !GetAtt Distribution.DomainName, !Sub "d${CloudFrontDistributionId}.cloudfront.net"]
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  WebsiteURL:
    Description: Website URL
    Value: !Sub "https://${Subdomain}.${DomainName}"
  BucketName:
    Description: S3 bucket name
    Value: !If [ShouldCreateBucket, !Ref S3Bucket, !Ref S3BucketName]
  DistributionId:
    Description: CloudFront distribution ID
    Value: !If [ShouldCreateCF, !Ref Distribution, !Ref CloudFrontDistributionId]
